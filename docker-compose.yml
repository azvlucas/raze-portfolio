services:
  db:
    image: postgres:16-alpine
    container_name: raze-portfolio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: raze_local
      POSTGRES_PASSWORD: local_only_password
      POSTGRES_DB: raze_portfolio
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "5433:5432"
    volumes:
      - raze_portfolio_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raze_local -d raze_portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  raze_portfolio_data:
